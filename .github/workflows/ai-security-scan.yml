name: Claude AI Security Scan (scoped)

on:
  workflow_dispatch:

env:
  SCAN_FILE: llmgoat/llm/manager.py
  SCAN_DIR: models

permissions:
  contents: read
  security-events: read
  id-token: write

jobs:
  claude-ai-scan:
    runs-on: ubuntu-latest
    steps:
      # Only these paths exist on the runner, so Claude cannot read anything else
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /llmgoat/llm/manager.py
            /models/
          sparse-checkout-cone-mode: false

      # Baseline: existing scanner alerts, limited to the same scope
      - name: Fetch existing alerts for the scoped files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" \
            | jq -s --arg file "${SCAN_FILE}" --arg dir "${SCAN_DIR}/" 'add
                | map(select(
                    (.most_recent_instance.location.path // "") as $p
                    | ($p == $file) or ($p | startswith($dir))
                  ))
                | map({
                    number,
                    tool: .tool.name,
                    rule: .rule.id,
                    severity: .rule.security_severity_level,
                    message: .most_recent_instance.message.text,
                    path: .most_recent_instance.location.path,
                    start_line: .most_recent_instance.location.start_line
                  })' > code-scanning-alerts.json \
            || echo '[]' > code-scanning-alerts.json
          echo "Baseline alerts in scope: $(jq length code-scanning-alerts.json)"

      - name: Claude AI security review (scoped)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Turn this off for real repositories, because the log exposes file content.
          show_full_output: true
          prompt: |
            You are a senior security engineer reviewing ML and LLM code by reading it.
            Do not run shell commands.

            SCOPE (strict): read ONLY these:
            1. ${{ env.SCAN_FILE }}
            2. everything under ${{ env.SCAN_DIR }}/
            3. code-scanning-alerts.json
            Do not read any other file, even if the code imports it. If a finding
            depends on code outside the scope (for example a helper function),
            report it as "depends on out-of-scope code" and say what should be checked.

            Binary files (.pkl, .h5, .pt, .bin, .onnx, model weights) cannot be
            reviewed by reading. List them by name and say they need a model scanner.

            STEP 1 - Find vulnerabilities by reading the code
            Look for: unsafe model loading or deserialization; model or dataset
            downloads without hash or signature verification (including hashes that
            are defined but never checked); unpinned third-party model downloads;
            path traversal; hardcoded secrets; thread-safety and race conditions;
            weak error handling that hides failures; prompt and template problems
            such as stop tokens that do not match the model's chat format; and
            insecure inference code (no auth, no input validation).

            STEP 2 - Compare with the scanners
            Read code-scanning-alerts.json. Label each of your findings:
            - "Also found by scanner" (tool and alert number), or
            - "NEW - missed by scanners"
            List scanner alerts that look like false positives or tool errors,
            with a reason.

            RULES
            - Report only what you can point to, with function name and line.
            - Give a confidence level (High / Medium / Low). Do not invent issues.
            - Include a short code excerpt as evidence.

            OUTPUT
            Write claude-scan-report.md with:
            1. Coverage table: every file in scope with its status
               (Reviewed by reading / Not reviewable: binary). Then a line stating
               that the rest of the repository was NOT scanned.
            2. Summary: number of findings, "Also found" vs "NEW".
            3. Findings table: ID | Title | Location | CWE | Severity | Confidence |
               Scanner status.
            4. For each NEW finding: evidence, how it could be exploited, a fix.
            5. Scanner alerts that look like false positives or tool errors.
            Then stop. Do not modify any other file.
          claude_args: >-
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Write"

      - name: Publish report to job summary
        if: hashFiles('claude-scan-report.md') != ''
        run: cat claude-scan-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: hashFiles('claude-scan-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-scan-report
          path: claude-scan-report.md
