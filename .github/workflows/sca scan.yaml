name: SCA Security Scan

on:
  pull_request:
    branches: [main, develop]

  # Disabled: the workflow will NOT run when code is pushed/committed to main
  # push:
  #   branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  pip-audit:
    name: pip-audit (Python dependency scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        # CPU-only wheels avoid a slow CUDA download / source build.
        # We only need these installed so pip-audit can see their versions.
        run: |
          pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            .

      - name: Run pip-audit
        run: pip-audit -f json -o pip-audit-results.json
        continue-on-error: true

      - name: Convert pip-audit JSON to SARIF
        run: python .github/scripts/pip_audit_to_sarif.py
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pip-audit-results.sarif
          category: pip-audit

  trivy:
    name: Trivy (filesystem + container scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f "Dockerfile" ] || [ -f "app/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ -f "Dockerfile" ]; then
              echo "path=Dockerfile" >> "$GITHUB_OUTPUT"
              echo "context=." >> "$GITHUB_OUTPUT"
            else
              echo "path=app/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "context=app" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for scanning
        if: steps.dockerfile.outputs.exists == 'true'
        run: |
          docker build \
            -f "${{ steps.dockerfile.outputs.path }}" \
            -t llmgoat:scan \
            "${{ steps.dockerfile.outputs.context }}"
        continue-on-error: true

      - name: Run Trivy image scan
        if: steps.dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: llmgoat:scan
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
        continue-on-error: true

      - name: Upload Trivy image SARIF
        if: steps.dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  sca-summary:
    name: SCA Summary
    runs-on: ubuntu-latest
    needs: [pip-audit, trivy]
    if: always()
    steps:
      - name: Report SCA status
        run: |
          echo "## SCA Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- pip-audit: ${{ needs.pip-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy: ${{ needs.trivy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Findings are available under the repo's Security > Code scanning tab." >> $GITHUB_STEP_SUMMARY
          echo "SBOM artifact (CycloneDX) is attached to this workflow run." >> $GITHUB_STEP_SUMMARY
